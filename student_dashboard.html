<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNHS LFMS - Student Dashboard</title>

    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="icon" type="image/png" href="logo.jpg">

    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        .navbar {
            background-color: #0f172a !important;
        }

        .navbar-logo {
            height: 40px;
            width: 40px;
            object-fit: cover;
            border-radius: 50%;
            margin-right: 12px;
        }

        .item-card {
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
        }

        .item-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05) !important;
        }

        .item-card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #f1f5f9;
        }

        .badge-lost {
            background-color: #fef2f2;
            color: #ef4444;
            border: 1px solid #fecaca;
        }

        .badge-found {
            background-color: #ecfdf5;
            color: #10b981;
            border: 1px solid #a7f3d0;
        }

        .search-input {
            border-radius: 50px;
            padding-left: 18px;
            border: 1px solid #cbd5e1;
        }

        .search-input:focus {
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <nav class="navbar navbar-dark navbar-expand-lg py-3 shadow-sm">
        <div class="container d-flex align-items-center">
            <div class="d-flex align-items-center">
                <img src="logo.jpg" alt="Logo" class="navbar-logo">
                <a class="navbar-brand fw-bold fs-5 mb-0" href="#">SNHS LFMS</a>
            </div>
            <div class="d-flex align-items-center text-light fs-6 ms-auto">
                <span class="me-3 opacity-75">Student: <strong class="opacity-100">godzilla</strong></span>
                <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container py-5">
        
        <!-- Action Header -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h3 class="fw-bold mb-1">Lost & Found Items</h3>
                <p class="text-muted small mb-0">Browse through reported belongings across campus.</p>
            </div>
            
            <!-- Quick Search Input -->
            <div style="max-width: 300px;" class="w-100">
                <input type="text" id="searchInput" class="form-control search-input py-2" placeholder="Search items or locations...">
            </div>
        </div>

        <!-- Cards Grid -->
        <div class="row g-4" id="itemGrid">
            <!-- Static Example Card 1 -->
            <div class="col-md-6 col-lg-4 item-col">
                <div class="card h-100 shadow-sm item-card bg-white">
                    <div class="item-card-img d-flex align-items-center justify-content-center text-muted small">
                        No Image Available
                    </div>
                    <div class="card-body d-flex flex-column justify-content-between p-3">
                        <div>
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <span class="badge rounded-pill badge-lost px-3 py-2 fw-semibold">Lost</span>
                                <small class="text-muted fw-medium">2026-03-30</small>
                            </div>
                            <h5 class="fw-bold text-dark item-title mb-2">Calculator</h5>
                            <p class="text-secondary small mb-3 item-desc">Casio scientific calculator left in the room.</p>
                        </div>
                        <div class="pt-3 border-top d-flex align-items-center text-muted small">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt me-2 text-primary" viewBox="0 0 16 16">
                                <path d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A31.493 31.493 0 0 1 8 14.58a31.481 31.481 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10"/>
                                <path d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4m0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                            </svg>
                            <span class="fw-semibold text-dark me-1">Location:</span> 
                            <span class="item-location">Room 302</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>

    <!-- Client-side filter script -->
    <script>
        document.getElementById('searchInput').addEventListener('keyup', function () {
            const filter = this.value.toLowerCase();
            const cols = document.querySelectorAll('.item-col');

            cols.forEach(col => {
                const title = col.querySelector('.item-title').textContent.toLowerCase();
                const desc = col.querySelector('.item-desc').textContent.toLowerCase();
                const location = col.querySelector('.item-location').textContent.toLowerCase();

                if (title.includes(filter) || desc.includes(filter) || location.includes(filter)) {
                    col.style.display = '';
                } else {
                    col.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
